<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap | User Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <!-- FLASH -->

  <main class="container">
    <div style="margin-bottom: 3.5rem;">
      <!-- Dashboard Header & View Switcher -->
      <div class="dashboard-header">
        <div>
          <h1 class="section-title" style="font-size: 2rem; margin-bottom: 0.25rem;">
            Dashboard
          </h1>
          <p class="section-desc">
            Logged in as <strong>@<!-- CURRENT_USERNAME --></strong> (<!-- CURRENT_ROLE -->)
          </p>
        </div>

        <!-- Dual-View Toggle Switcher via Query Params -->
        <div class="role-tabs">
          <a
            href="/dashboard?view=creator"
            class="tab-btn <!-- TAB_CREATOR_ACTIVE -->"
            style="text-decoration: none;"
          >
            🎨 Creator View
          </a>
          <a
            href="/dashboard?view=client"
            class="tab-btn <!-- TAB_CLIENT_ACTIVE -->"
            style="text-decoration: none;"
          >
            💼 Client View
          </a>
        </div>
      </div>

      <!-- VIEW_CONTENT -->
    </div>

    <!-- New Service Listing Pure CSS Modal (Zero JS) -->
    <div class="modal-backdrop" id="new-service-modal">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title">List a New Service</h3>
          <a href="#" class="close-btn" style="text-decoration: none;">&times;</a>
        </div>

        <form action="/services/new" method="POST">
          <div style="margin-bottom: 1rem;">
            <label class="form-label">Service Title</label>
            <input
              type="text"
              name="title"
              class="form-control"
              placeholder="e.g. Modern YouTube Thumbnails &amp; Banner Pack"
              required
            />
          </div>

          <div style="margin-bottom: 1rem;">
            <label class="form-label">Category</label>
            <select name="category" class="form-control" required>
              <option value="Design">🎨 Design</option>
              <option value="Editing">🎬 Editing</option>
              <option value="Tutoring">📚 Tutoring</option>
              <option value="Music">🎵 Music</option>
            </select>
          </div>

          <div style="margin-bottom: 1rem;">
            <label class="form-label">Price (₹ INR)</label>
            <input
              type="number"
              name="price"
              step="1"
              min="10"
              class="form-control"
              placeholder="499"
              required
            />
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label class="form-label">Service Description &amp; Scope</label>
            <textarea
              name="description"
              rows="4"
              class="form-control"
              placeholder="Describe deliverables, turnaround time, tools used, and what clients should provide..."
              required
            ></textarea>
          </div>

          <div style="display: flex; gap: 0.75rem;">
            <a href="#" class="btn btn-secondary" style="flex: 1; text-decoration: none;">
              Cancel
            </a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">
              Publish Listing
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

</body>
</html>
