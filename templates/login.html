<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap | Welcome Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=golden" />
</head>
<body>

  <!-- NAVBAR -->
  <!-- FLASH -->

  <main class="container">
    <div style="min-height: calc(100vh - 160px); display: flex; align-items: center; justify-content: center; padding: 1rem 0 3rem 0;">
      <div class="card" style="max-width: 440px; width: 100%; padding: 2.75rem 2.5rem; border-radius: 16px;">
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 1.45rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; margin-bottom: 0.45rem;">
            SkillSwap | Welcome Back
          </h1>
          <p style="font-size: 0.9rem; color: var(--text-muted); font-weight: 400; line-height: 1.4;">
            Sign In to Your Creator &amp; Client Hub
          </p>
        </div>

        <!-- Login Form -->
        <form action="/login" method="POST">
          <!-- Email Field -->
          <div style="margin-bottom: 1.25rem; position: relative;">
            <div style="position: relative; display: flex; align-items: center;">
              <svg style="position: absolute; left: 1rem; width: 18px; height: 18px; color: var(--text-muted); pointer-events: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
              </svg>
              <input
                type="email"
                name="email"
                class="form-control"
                style="padding-left: 2.75rem; margin-bottom: 0;"
                placeholder="Email"
                required
              />
            </div>
          </div>

          <!-- Password Field -->
          <div style="margin-bottom: 1.25rem; position: relative;">
            <div style="position: relative; display: flex; align-items: center;">
              <svg style="position: absolute; left: 1rem; width: 18px; height: 18px; color: var(--text-muted); pointer-events: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
              <input
                type="password"
                name="password"
                class="form-control"
                style="padding-left: 2.75rem; margin-bottom: 0;"
                placeholder="Password"
                required
              />
            </div>
          </div>

          <!-- Options Row -->
          <div style="display: flex; align-items: center; justify-content: space-between; margin: 1.25rem 0 1.75rem 0; font-size: 0.85rem;">
            <label style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-muted); cursor: pointer;">
              <input type="checkbox" name="remember" style="width: 16px; height: 16px; accent-color: var(--primary);" />
              <span>Remember Me</span>
            </label>
            <a href="#" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-block" style="border-radius: 10px; padding: 0.875rem 1rem;">
            Sign In
          </button>
        </form>

        <!-- Footer Text -->
        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
          Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign Up</a>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
