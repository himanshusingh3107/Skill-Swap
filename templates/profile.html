<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap | @<!-- USER_USERNAME -->'s Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=golden" />
</head>
<body>

  <!-- NAVBAR -->
  <!-- FLASH -->

  <main class="container">
    <div style="max-width: 860px; margin: 0 auto; padding-bottom: 4rem;">
      <!-- Profile Hero Card -->
      <div class="profile-hero-card">
        <!-- Overlapping Circular Avatar -->
        <div class="profile-avatar-large">
          <!-- USER_AVATAR -->
        </div>

        <!-- Creator Name & Tagline -->
        <h1 class="profile-name"><!-- USER_USERNAME --></h1>
        <p class="profile-tagline">
          <!-- USER_TAGLINE -->
        </p>

        <!-- Action Button -->
        <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem;">
          <a href="#gigs" class="btn btn-primary">
            Contact &amp; Book Service
          </a>
        </div>

        <!-- Two-Column Grid: Core Skills (Left) & Bio (Right) -->
        <div class="profile-grid-2col">
          <!-- Left: Core Skills -->
          <div>
            <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main);">
              Core Skills &amp; Focus
            </h3>
            <div class="skills-list">
              <!-- USER_SKILLS -->
            </div>
          </div>

          <!-- Right: Bio Paragraph -->
          <div>
            <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">
              About @<!-- USER_USERNAME -->
            </h3>
            <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.65; white-space: pre-line;">
              <!-- USER_BIO -->
            </p>
          </div>
        </div>

        <!-- Stats Row at Bottom -->
        <div class="stats-row">
          <div class="stat-item">
            <div class="stat-val">★ <!-- USER_RATING --></div>
            <div class="stat-lbl">Average Rating</div>
          </div>
          <div class="stat-item">
            <div class="stat-val"><!-- USER_COMPLETED_GIGS --></div>
            <div class="stat-lbl">Completed Gigs</div>
          </div>
          <div class="stat-item">
            <div class="stat-val">&lt; 2h</div>
            <div class="stat-lbl">Avg Response Time</div>
          </div>
        </div>
      </div>

      <!-- Creator's Active Listings -->
      <div id="gigs" style="margin-top: 3.5rem;">
        <div class="section-header">
          <div>
            <h2 class="section-title">Active Services by @<!-- USER_USERNAME --></h2>
            <p class="section-desc">Browse and book direct offerings from this creator</p>
          </div>
        </div>

        <div class="service-grid">
          <!-- CREATOR_SERVICES -->
        </div>
      </div>
    </div>
  </main>

</body>
</html>
