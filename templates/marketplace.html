<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap | Marketplace Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=golden" />
</head>
<body>

  <!-- NAVBAR -->
  <!-- FLASH -->

  <main class="container">
    <div style="margin-bottom: 2rem;">
      <h1 class="section-title" style="font-size: 2.1rem; margin-bottom: 0.5rem;">
        Explore Creative Services
      </h1>
      <p class="section-desc">
        Discover young creators offering design, editing, tutoring, and music production.
      </p>
    </div>

    <!-- Search & Category Filter Bar (Pure HTML Form, Zero JS) -->
    <div class="filter-bar">
      <form action="/marketplace" method="GET" class="search-input-wrap" style="display: flex; align-items: center; gap: 0.5rem;">
        <!-- HIDDEN_CATEGORY_INPUT -->

        <div style="position: relative; flex: 1;">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
          <input
            type="text"
            name="q"
            placeholder="Search gigs, skills, or creator handles..."
            value="<!-- SEARCH_QUERY -->"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-sm" style="padding: 0.65rem 1.15rem; border-radius: var(--radius-full);">
          Search
        </button>
        <!-- CLEAR_SEARCH_BTN -->
      </form>

      <div class="category-pills">
        <!-- CATEGORY_PILLS -->
      </div>
    </div>

    <!-- Services Grid -->
    <div class="service-grid">
      <!-- SERVICES_GRID -->
    </div>
  </main>

</body>
</html>
